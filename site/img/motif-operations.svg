<svg viewBox="0 0 600 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of connected workflow nodes with a clock-hand accent, suggesting automated processes">
	<defs>
		<linearGradient id="chromeO" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#eef0f2"/>
			<stop offset="35%" stop-color="#c4c7cb"/>
			<stop offset="55%" stop-color="#868a92"/>
			<stop offset="75%" stop-color="#d4d7db"/>
			<stop offset="100%" stop-color="#eef0f2"/>
		</linearGradient>
	</defs>

	<!-- connecting flow lines -->
	<g fill="none" stroke="#9ba0a7" stroke-width="1.3" opacity="0.6">
		<path d="M 110 150 C 160 110, 210 110, 250 150"/>
		<path d="M 250 150 C 300 190, 300 230, 260 260"/>
		<path d="M 260 260 C 320 290, 380 270, 420 220"/>
		<path d="M 420 220 C 450 180, 470 160, 500 130"/>
		<path d="M 260 260 C 230 310, 220 340, 180 360"/>
	</g>

	<!-- direction chevrons along the main path -->
	<g fill="#f5f3ef" opacity="0.8">
		<path d="M190 128 l7 -4 l0 8 z" transform="rotate(20 190 128)"/>
		<path d="M340 206 l7 -4 l0 8 z" transform="rotate(70 340 206)"/>
		<path d="M455 172 l7 -4 l0 8 z" transform="rotate(-35 455 172)"/>
	</g>

	<!-- nodes -->
	<circle cx="110" cy="150" r="10" fill="none" stroke="#f5f3ef" stroke-width="1.5"/>
	<circle cx="250" cy="150" r="8" fill="none" stroke="#9ba0a7" stroke-width="1.3"/>
	<circle cx="260" cy="260" r="26" fill="#1d1d20" stroke="url(#chromeO)" stroke-width="2"/>
	<circle cx="420" cy="220" r="8" fill="none" stroke="#9ba0a7" stroke-width="1.3"/>
	<circle cx="500" cy="130" r="10" fill="none" stroke="#f5f3ef" stroke-width="1.5"/>
	<circle cx="180" cy="360" r="8" fill="none" stroke="#9ba0a7" stroke-width="1.3"/>

	<!-- clock hands inside the main node, standing for speed/time -->
	<g stroke="#f5f3ef" stroke-width="2" stroke-linecap="round">
		<line x1="260" y1="260" x2="260" y2="244"/>
		<line x1="260" y1="260" x2="273" y2="266"/>
	</g>
	<circle cx="260" cy="260" r="2" fill="#f5f3ef"/>

	<!-- small satellite ticks -->
	<circle cx="505" cy="300" r="2.5" fill="#c4c7cb"/>
	<circle cx="90" cy="260" r="2" fill="#9ba0a7"/>
	<circle cx="340" cy="90" r="2" fill="#9ba0a7"/>
</svg>
